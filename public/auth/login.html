/* AVAND revision 03 — no moving dots; more delicate central vein */
.particles, .particle-core, .particle-tail { display: none !important; visibility: hidden !important; }
.flow-control > .icon-button { display:none !important; }

/* AVAND CLEAN EDITION — precisely paired light/dark palette */
html,body,#root{min-height:100%;}
body{background:#fff;}
.app,.app.light{
 --fg:#1b1b1b;--muted:#626262;--edge:rgba(0,0,0,.17);
 --card:#f5f5f5;--field:#fff;--button:#242424;--button-fg:#fff;
 --controls:#f2f2f2;--selected:rgba(0,0,0,.10);
 background:#fff!important;color:#1b1b1b!important;color-scheme:light;
 transition:background-color .18s ease,color .18s ease;
}
.app.dark{
 --fg:#f0f0f0;--muted:#aaa;--edge:rgba(255,255,255,.19);
 --card:#191919;--field:#101010;--button:#eee;--button-fg:#171717;
 --controls:#222;--selected:rgba(255,255,255,.13);
 background:#101010!important;color:#f0f0f0!important;color-scheme:dark;
}
.app .auth-card{background:var(--card)!important;border:1px solid var(--edge)!important;box-shadow:0 18px 65px rgba(0,0,0,.06)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.app.dark .auth-card{box-shadow:0 18px 65px rgba(0,0,0,.30)!important}
.app .input-wrap{background:var(--field)!important}
.app .switch-group{background:var(--controls)!important;backdrop-filter:none!important}
.app .submit-button{background:var(--button)!important;color:var(--button-fg)!important}
.app .story h1 em{font-family:inherit;font-style:normal;font-weight:400;letter-spacing:inherit}
.app .scene,.app .leaf-scene,.app .scene-wash,.app .scene-grain,.app .design-options,.app .design-dialog,.app .flow-control,.app .phi-guides,.app .skip-intro{display:none!important}
.app,.app *{animation:none!important}

html, body { min-height:100%; }
body { position:relative; background:#faf9f6; }

#root .app.light, #root .app.dark { background:transparent!important; }

#root .app .auth-card { background:var(--card)!important; -webkit-backdrop-filter:blur(27px) saturate(135%)!important; backdrop-filter:blur(27px) saturate(135%)!important; border:1px solid var(--edge)!important; box-shadow:0 22px 75px rgba(10,12,17,.14), inset 0 1px rgba(255,255,255,.55)!important; }
#root .app.dark .auth-card { box-shadow:0 23px 76px rgba(0,0,0,.37),inset 0 1px rgba(255,255,255,.15)!important; }
#root .app .input-wrap { background:var(--field)!important; -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); }
#root .app .switch-group { background:var(--controls)!important; -webkit-backdrop-filter:blur(19px)!important; backdrop-filter:blur(19px)!important; }
#root .app .story { text-shadow:0 1px 24px rgba(255,255,255,.50); }
#root .app.dark .story { text-shadow:0 1px 22px rgba(0,0,0,.78); }
@supports not (backdrop-filter:blur(1px)) {#root .app .auth-card {background:rgba(249,249,249,.88)!important}#root .app.dark .auth-card {background:rgba(20,20,21,.9)!important}}

  border:1px solid rgba(255,255,255,.42)!important;

  background:rgba(255,255,255,.08)!important;
  -webkit-backdrop-filter:blur(14px) saturate(140%)!important;

  border:1px solid rgba(255,255,255,.17)!important;
